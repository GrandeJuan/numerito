services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: numerito-backend
    ports:
      - "5101:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3001"
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_NAME: numerito
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      FRONTEND_URL: "http://127.0.0.1:5100"
      NODE_ENV: production

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://127.0.0.1:5101/api"
        NEXT_PUBLIC_SHOW_DEV_USERS: "true"
    container_name: numerito-frontend
    ports:
      - "5100:3000"
    depends_on:
      - backend
