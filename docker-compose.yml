x-backend-env: &backend-env
  DB_HOST: ${DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-admin}
  DB_NAME: ${DB_NAME:-numerito}
  NODE_ENV: ${NODE_ENV:-production}

services:
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: numerito-migrate
    command: ["node", "--experimental-require-module", "dist/migrate"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-env
    restart: "no"

  # Build-only: produces the numerito-scraper image used by DockerTaskLauncher
  # at runtime. Never started as a service (its own entrypoint runs once per
  # launch). Opt-in with `--profile build-only` so regular `up` skips it.
  scraper-image:
    build:
      context: .
      dockerfile: infra/fargate-scraper/Dockerfile
    image: ${SCRAPER_IMAGE:-numerito-scraper:latest}
    profiles: ["build-only"]
    command: ["true"]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: numerito-backend
    ports:
      - "${BACKEND_PORT:-5101}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount the docker socket so DockerTaskLauncher can spawn scraper containers.
      # In prod (AWS), ECS_CLUSTER_ARN is set and the AWS adapter is used instead —
      # this mount is a no-op.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *backend-env
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5100,http://localhost:5100}
      INGESTA_SECRET: ${INGESTA_SECRET:-dev-ingesta-secret-change-in-production}
      SCRAPER_IMAGE: ${SCRAPER_IMAGE:-numerito-scraper:latest}
      # URL the scraper container uses to POST its resultado back.
      # host.docker.internal resolves to the docker host; reaches the mapped backend port.
      SCRAPER_BACKEND_URL: ${SCRAPER_BACKEND_URL:-http://host.docker.internal:${BACKEND_PORT:-5101}}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:5101/api}
        NEXT_PUBLIC_SHOW_DEV_USERS: ${NEXT_PUBLIC_SHOW_DEV_USERS:-true}
    container_name: numerito-frontend
    ports:
      - "${FRONTEND_PORT:-5100}:3000"
    depends_on:
      - backend
